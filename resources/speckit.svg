<!--
  Activity Bar icon.

  VS Code masks the SVG and paints it with the theme's own foreground colour, so
  only the shape carries: a document with a folded corner and two ruled lines,
  which is what this extension makes. Drawn on the 24x24 grid the Activity Bar
  expects, with strokes heavy enough to survive being scaled down to 16px.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
     fill="none" stroke="currentColor" stroke-width="1.7"
     stroke-linecap="round" stroke-linejoin="round">
  <path d="M14 2.75H7A2.25 2.25 0 0 0 4.75 5v14A2.25 2.25 0 0 0 7 21.25h10A2.25 2.25 0 0 0 19.25 19V8z" />
  <path d="M14 2.75V8h5.25" />
  <path d="M8.25 12.5h7.5" />
  <path d="M8.25 16h4.75" />
</svg>
