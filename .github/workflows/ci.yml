name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # WeasyPrint renders through Pango/Cairo rather than bundling them, so the
      # native libraries have to exist before `pip install` is of any use.
      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libcairo2 libgdk-pixbuf-2.0-0 libffi-dev

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      # Mermaid CLI is optional at runtime (the backend falls back to the Kroki
      # API), but rendering locally keeps the diagram tests off the network.
      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Run tests
        working-directory: backend
        env:
          USE_POSTGRES: 'false'
          SPECKIT_EXT_API_KEY: dev-key
        run: pytest tests/ -q

  extension:
    name: VS Code extension (compile, lint, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Compile
        working-directory: vscode-extension
        run: npm run compile

      - name: Lint
        working-directory: vscode-extension
        run: npm run lint

      # `npm test` drives a real VS Code instance; only the pure-logic Jest
      # suite runs headlessly without one.
      - name: Unit tests
        working-directory: vscode-extension
        run: npm run test:unit

  frontend:
    name: Dashboard (typecheck, lint, vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Tests
        working-directory: frontend
        run: npm run test
