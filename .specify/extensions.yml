installed:
- agent-context
settings:
  auto_execute_hooks: true
hooks:
  after_specify:
  - extension: agent-context
    command: speckit.agent-context.update
    enabled: true
    optional: true
    priority: 10
    prompt: Execute speckit.agent-context.update?
    description: Refresh agent context after specification
    condition: null
  after_plan:
  - extension: agent-context
    command: speckit.agent-context.update
    enabled: true
    optional: true
    priority: 10
    prompt: Execute speckit.agent-context.update?
    description: Refresh agent context after planning
    condition: null
  after_create_markdown:
  - extension: docs-agent-extension
    command: /speckit.ext.docgen
    enabled: true
    optional: true
    priority: 20
    prompt: Generate documentation from the new markdown artifact?
    description: Send newly created markdown files to the documentation pipeline
    condition: null
